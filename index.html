<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>रेसिपी और कॉस्ट मैनेजर — शुद्ध सात्विक भोग प्रसादी</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans Devanagari', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 1;
    }
    .card-dark {
      background: #1e293b;
      border: 1px solid #334155;
      transition: all 0.2s ease;
    }
    .card-checked {
      background: #14332b !important;
      border-color: #10b981 !important;
    }
    .input-dark {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
    }
    .input-dark:focus {
      outline: none;
      border-color: #eab308;
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-[#0f172a]/95 backdrop-blur border-b border-slate-800 px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <!-- Logo Image Upload & Closeup Viewer -->
        <div onclick="handleLogoTap()" id="logoContainer" class="w-12 h-12 rounded-full bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center shadow-lg border-2 border-amber-200 shrink-0 cursor-pointer overflow-hidden relative">
          <img id="logoImg" src="" alt="Logo" class="w-full h-full object-cover hidden" />
          <svg id="logoDefaultIcon" class="w-7 h-7 text-slate-950" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C9.5 6 7 8.5 7 12c0 2.8 2.2 5 5 5s5-2.2 5-5c0-3.5-2.5-6-5-10zm-7 9c-1.5 1.5-2 3.5-1 5.5 1 2 3.5 3 6 2.5-2.5-1.5-4.2-4.3-5-8zm14 0c-.8 3.7-2.5 6.5-5 8 2.5.5 5-.5 6-2.5 1-2 .5-4-1-5.5zM4 20h16v2H4v-2z"/>
          </svg>
        </div>
        <input type="file" id="imageUploadInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />

        <div>
          <h1 id="editableTitle" contenteditable="true" onblur="saveCustomHeader()" class="text-lg sm:text-xl font-bold text-amber-400 leading-tight outline-none focus:ring-1 focus:ring-amber-400 rounded px-1" title="क्लिक करके नाम बदलें">राधा भोग प्रसादी costing</h1>
          <p id="editableSubtitle" contenteditable="true" onblur="saveCustomHeader()" class="text-xs text-slate-400 outline-none focus:ring-1 focus:ring-slate-400 rounded px-1 mt-0.5" title="क्लिक करके विवरण बदलें">शुद्ध सात्विक भोग प्रसादी सामग्री • श्री राधे</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openSheetModal()" id="syncBtn" class="px-2.5 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-600 text-amber-300 flex items-center gap-1 transition" title="Google Sheet सेटिंग्स">
          <span>⚙️</span>
        </button>
        <button onclick="saveToGoogleSheet()" id="saveSheetBtn" class="px-3 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow transition">
          ☁️ सेव करें
        </button>
        <button onclick="triggerBackup()" class="px-3 py-2 rounded-xl text-xs font-bold bg-sky-600 hover:bg-sky-500 text-white shadow transition" title="गूगल शीट में टाइमस्टैम्प के साथ बैकअप लें">
          🛡️ बैकअप लें
        </button>
      </div>
    </div>
  </header>

  <!-- Fullscreen Image Closeup Modal -->
  <div id="imageZoomModal" onclick="closeImageZoom()" class="fixed inset-0 z-50 hidden bg-black/95 backdrop-blur-md flex items-center justify-center p-4 cursor-pointer">
    <div class="relative
