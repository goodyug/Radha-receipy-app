<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भोग प्रसादी मैनेजर</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background 0.3s ease; }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body id="master-body" class="bg-gray-900 text-gray-100 min-h-screen p-3 md:p-6 pb-20">

    <!-- Header App Bar -->
    <header id="master-header" class="bg-gray-800 p-4 rounded-2xl shadow-lg mb-6 border border-gray-700 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="relative group cursor-pointer" onclick="triggerHeaderUpload()">
                <img id="app-logo" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=200" class="w-14 h-14 rounded-full object-cover border-2 border-yellow-500 shadow-md">
                <input type="file" id="header-file-input" accept="image/*" class="hidden" onchange="uploadHeaderLogo(event)">
            </div>
            <div>
                <h1 id="app-title-text" onclick="editAppHeader()" class="text-xl font-bold text-yellow-400 cursor-pointer flex items-center gap-2">
                    <span id="app-title-display">रेसिपी और कॉस्ट मैनेजर</span>
                    <i class="fa-solid fa-pen-to-square text-xs text-gray-400"></i>
                </h1>
                <p id="app-sub-text" onclick="editAppHeader()" class="text-xs text-gray-300 cursor-pointer">
                    <span id="app-sub-display">भोग प्रसादी सामग्री</span>
                </p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openThemeModal()" class="bg-purple-600 hover:bg-purple-700 text-white p-2.5 rounded-xl text-sm shadow transition" title="थीम और रंग बदलें">
                <i class="fa-solid fa-palette"></i>
            </button>
            <button onclick="openAddRecipeModal()" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 px-3 rounded-xl text-sm shadow transition flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> नई रेसिपी
            </button>
        </div>
    </header>

    <!-- Recipe List Container -->
    <div id="recipes-container" class="space-y-4"></div>

    <!-- Zoom / Ingredient Detail Modal (Separate Image View) -->
    <div id="zoom-modal" class="modal fixed inset-0 bg-black/80 backdrop-blur-sm z-50 justify-center items-center p-4" onclick="closeZoomModal()">
        <div id="zoom-card" class="bg-gray-800 border border-gray-700 p-4 rounded-2xl max-w-sm w-full text-center relative shadow-2xl space-y-3" onclick="event.stopPropagation()">
            <button onclick="closeZoomModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white text-xl">✕</button>
            <img id="zoom-img" src="" class="w-full h-56 object-cover rounded-xl shadow-lg border border-gray-700">
            <h3 id="zoom-title" class="text-lg font-bold text-yellow-400"></h3>
            <p id="zoom-desc" class="text-sm text-gray-300"></p>
        </div>
    </div>

    <!-- Theme & Color Settings Modal -->
    <div id="theme-modal" class="modal fixed inset-0 bg-black/80 backdrop-blur-sm z-50 justify-center items-center p-4">
        <div class="bg-gray-800 border border-gray-700 p-5 rounded-2xl max-w-sm w-full space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-purple-400 flex items-center gap-2">
                <i class="fa-solid fa-palette"></i> रंग व थीम कस्टमाइज़र
            </h3>
            <div>
                <label class="text-xs text-gray-300">ऐप बैकग्राउंड रंग (Body Background)</label>
                <input type="color" id="picker-body-bg" class="w-full h-9 rounded mt-1 bg-transparent cursor-pointer">
            </div>
            <div>
                <label class="text-xs text-gray-300">कार्ड्स बैकग्राउंड रंग (Cards Background)</label>
                <input type="color" id="picker-card-bg" class="w-full h-9 rounded mt-1 bg-transparent cursor-pointer">
            </div>
            <div>
                <label class="text-xs text-gray-300">मुख्य शीर्षक रंग (Title Color)</label>
                <input type="color" id="picker-title-color" class="w-full h-9 rounded mt-1 bg-transparent cursor-pointer">
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeThemeModal()" class="bg-gray-700 px-4 py-2 rounded-xl text-sm">रद्द करें</button>
                <button onclick="saveThemeSettings()" class="bg-purple-600 text-white font-bold px-4 py-2 rounded-xl text-sm">लागू करें</button>
            </div>
        </div>
    </div>

    <!-- Ingredient Edit Modal -->
    <div id="edit-ing-modal" class="modal fixed inset-0 bg-black/80 backdrop-blur-sm z-50 justify-center items-center p-4">
        <div class="bg-gray-800 border border-gray-700 p-5 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-yellow-400">सामग्री एडिट करें</h3>
            
            <!-- Separate Image Upload for Ingredient -->
            <div class="flex items-center space-x-3 bg-gray-900 p-2.5 rounded-xl border border-gray-700">
                <img id="edit-ing-preview" src="" class="w-12 h-12 rounded-lg object-cover border border-gray-600">
                <div class="flex-1">
                    <label class="text-[10px] text-gray-400 block">इस सामग्री की अपनी फोटो</label>
                    <input type="file" id="edit-ing-file" accept="image/*" class="hidden" onchange="previewEditIngPhoto(event)">
                    <button type="button" onclick="document.getElementById('edit-ing-file').click()" class="bg-gray-700 hover:bg-gray-600 text-xs px-2 py-1 rounded text-white mt-1">
                        फोटो बदलें
                    </button>
                </div>
            </div>

            <div>
                <label class="text-xs text-gray-400">नाम</label>
                <input type="text" id="edit-ing-name" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs text-gray-400">ग्राम (gm)</label>
                    <input type="number" step="any" id="edit-ing-gram" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400">किलो (kg)</label>
                    <input type="number" step="any" id="edit-ing-kg" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
                </div>
            </div>
            <div>
                <label class="text-xs text-gray-400">रेट ₹/kg</label>
                <input type="number" step="any" id="edit-ing-rate" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeEditIngModal()" class="bg-gray-700 px-4 py-2 rounded-xl text-sm">रद्द करें</button>
                <button onclick="saveIngredientEdit()" class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-sm">सेव करें</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal fixed inset-0 bg-black/70 backdrop-blur-sm z-50 justify-center items-center p-4">
        <div class="bg-gray-800 border border-gray-700 p-5 rounded-2xl max-w-xs w-full text-center space-y-4 shadow-xl">
            <i class="fa-solid fa-triangle-exclamation text-yellow-400 text-3xl"></i>
            <h3 id="confirm-text" class="text-base font-semibold text-gray-100">क्या आप वाकई इसे हटाना चाहते हैं?</h3>
            <div class="flex justify-center space-x-3">
                <button onclick="closeConfirmModal(false)" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-xl text-sm">नहीं</button>
                <button id="confirm-yes-btn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-xl text-sm font-bold">हाँ, हटाएँ</button>
            </div>
        </div>
    </div>

    <!-- Add Recipe Modal -->
    <div id="add-recipe-modal" class="modal fixed inset-0 bg-black/70 backdrop-blur-sm z-50 justify-center items-center p-4">
        <div class="bg-gray-800 border border-gray-700 p-5 rounded-2xl max-w-xs w-full space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-yellow-400">नई रेसिपी जोड़ें</h3>
            <div>
                <label class="text-xs text-gray-400">रेसिपी का नाम</label>
                <input type="text" id="new-rec-name" placeholder="जैसे: समोसा मसाला" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
            </div>
            <div>
                <label class="text-xs text-gray-400">उप-शीर्षक (विवरण)</label>
                <input type="text" id="new-rec-sub" placeholder="जैसे: 5kg बैच" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="closeAddRecipeModal()" class="bg-gray-700 px-4 py-2 rounded-xl text-sm">रद्द करें</button>
                <button onclick="createNewRecipe()" class="bg-yellow-500 text-gray-900 font-bold px-4 py-2 rounded-xl text-sm">जोड़ें</button>
            </div>
        </div>
    </div>

    <script>
        const defaultRecipes = [
            {
                id: 'rec-1',
                title: 'इमली-गुड़ मीठी चटनी',
                subtitle: 'भोग प्रसादी रेसिपी',
                photo: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400',
                ingredients: [
                    { id: '1', name: 'इमली', gramQty: 400, kgQty: 0, ratePerKg: 100, photo: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400' },
                    { id: '2', name: 'गुड़', gramQty: 0, kgQty: 1, ratePerKg: 70, photo: '' }
                ]
            }
        ];

        let recipes = JSON.parse(localStorage.getItem('food_recipes_db_clean')) || defaultRecipes;
        let activeRecipeId = recipes[0] ? recipes[0].id : null;
        let confirmCallback = null;
        let currentEditingIng = { recId: null, ingId: null, tempPhoto: '' };

        // Theme Load
        let appTheme = JSON.parse(localStorage.getItem('app_custom_theme')) || { bodyBg: '#111827', cardBg: '#1F2937', titleColor: '#FBBF24' };
        function applyTheme() {
            document.getElementById('master-body').style.backgroundColor = appTheme.bodyBg;
            document.getElementById('master-header').style.backgroundColor = appTheme.cardColor || appTheme.cardBg;
            document.getElementById('app-title-display').style.color = appTheme.titleColor;
            document.getElementById('picker-body-bg').value = appTheme.bodyBg;
            document.getElementById('picker-card-bg').value = appTheme.cardBg;
            document.getElementById('picker-title-color').value = appTheme.titleColor;
        }

        function openThemeModal() { document.getElementById('theme-modal').classList.add('active'); }
        function closeThemeModal() { document.getElementById('theme-modal').classList.remove('active'); }
        function saveThemeSettings() {
            appTheme = {
                bodyBg: document.getElementById('picker-body-bg').value,
                cardBg: document.getElementById('picker-card-bg').value,
                titleColor: document.getElementById('picker-title-color').value
            };
            localStorage.setItem('app_custom_theme', JSON.stringify(appTheme));
            applyTheme();
            closeThemeModal();
            renderRecipes();
        }

        // Header Setup
        document.getElementById('app-title-display').innerText = localStorage.getItem('app_header_title') || 'रेसिपी और कॉस्ट मैनेजर';
        document.getElementById('app-sub-display').innerText = localStorage.getItem('app_header_sub') || 'भोग प्रसादी सामग्री';
        document.getElementById('app-logo').src = localStorage.getItem('app_header_logo') || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=200';

        function saveRecipes() {
            localStorage.setItem('food_recipes_db_clean', JSON.stringify(recipes));
            renderRecipes();
        }

        function toggleRecipe(id) {
            activeRecipeId = activeRecipeId === id ? null : id;
            renderRecipes();
        }

        function calculateTotals(ingredients) {
            let totalWeightKg = 0;
            let totalCost = 0;
            ingredients.forEach(item => {
                const itemKg = (Number(item.gramQty) || 0) / 1000 + (Number(item.kgQty) || 0);
                const itemCost = itemKg * (Number(item.ratePerKg) || 0);
                totalWeightKg += itemKg;
                totalCost += itemCost;
            });
            return { totalWeightKg, totalCost };
        }

        function renderRecipes() {
            const container = document.getElementById('recipes-container');
            container.innerHTML = '';

            recipes.forEach(rec => {
                const isOpen = rec.id === activeRecipeId;
                const { totalWeightKg, totalCost } = calculateTotals(rec.ingredients);

                const card = document.createElement('div');
                card.style.backgroundColor = appTheme.cardBg;
                card.className = 'rounded-2xl border border-gray-700 shadow-lg overflow-hidden transition-all';
                
                let html = `
                    <div class="p-4 flex items-center justify-between cursor-pointer hover:bg-black/10" onclick="toggleRecipe('${rec.id}')">
                        <div class="flex items-center space-x-3">
                            <img src="${rec.photo}" onclick="event.stopPropagation(); openZoomModal('${rec.photo}', '${rec.title}', '${rec.subtitle}')" class="w-12 h-12 rounded-xl object-cover border border-gray-600 shadow-sm">
                            <div>
                                <h2 class="font-bold text-gray-100">${rec.title}</h2>
                                <p class="text-xs text-gray-400">${rec.subtitle} • ${rec.ingredients.length} सामग्री</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <div class="text-right">
                                <span class="block text-sm font-bold text-yellow-400">₹${totalCost.toFixed(2)}</span>
                                <span class="block text-xs text-gray-400">${totalWeightKg.toFixed(2)} kg</span>
                            </div>
                            <i class="fa-solid ${isOpen ? 'fa-chevron-up' : 'fa-chevron-down'} text-gray-400 text-sm"></i>
                        </div>
                    </div>
                `;

                if (isOpen) {
                    html += `
                        <div class="border-t border-gray-700 p-4 bg-black/20 space-y-4">
                            <!-- Recipe Header Info -->
                            <div class="flex items-center justify-between bg-black/30 p-3 rounded-xl border border-gray-700">
                                <div class="flex items-center space-x-3">
                                    <div class="relative cursor-pointer" onclick="triggerRecipePhotoUpload('${rec.id}')">
                                        <img src="${rec.photo}" class="w-16 h-16 rounded-xl object-cover border border-yellow-500 shadow">
                                        <input type="file" id="photo-input-${rec.id}" accept="image/*" class="hidden" onchange="uploadRecipePhoto(event, '${rec.id}')">
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-white flex items-center gap-2">
                                            ${rec.title}
                                            <i onclick="editRecipeTitle('${rec.id}')" class="fa-solid fa-pen-to-square text-xs text-gray-400 cursor-pointer"></i>
                                        </h3>
                                        <p class="text-xs text-gray-400">${rec.subtitle}</p>
                                    </div>
                                </div>
                                <button onclick="confirmDeleteRecipe('${rec.id}')" class="text-red-400 hover:text-red-300 p-2">
                                    <i class="fa-solid fa-trash-can text-lg"></i>
                                </button>
                            </div>

                            <!-- Totals -->
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-black/30 p-3 rounded-xl border border-gray-700">
                                    <span class="text-xs text-gray-400">कुल लागत</span>
                                    <p class="text-xl font-bold text-yellow-400">₹${totalCost.toFixed(2)}</p>
                                </div>
                                <div class="bg-black/30 p-3 rounded-xl border border-gray-700">
                                    <span class="text-xs text-gray-400">कुल वजन</span>
                                    <p class="text-xl font-bold text-emerald-400">${totalWeightKg.toFixed(3)} kg</p>
                                </div>
                            </div>

                            <!-- Add Ingredient Form -->
                            <form onsubmit="addIngredient(event, '${rec.id}')" class="bg-black/30 p-3 rounded-xl border border-gray-700 space-y-3">
                                <span class="text-xs font-bold text-yellow-400">नई सामग्री जोड़ें</span>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                                    <input type="text" id="ing-name-${rec.id}" placeholder="सामग्री का नाम" required class="bg-gray-900 border border-gray-700 p-2 rounded-lg text-xs text-white focus:outline-none">
                                    <div class="flex space-x-1">
                                        <input type="number" step="any" id="ing-gram-${rec.id}" placeholder="ग्राम (gm)" class="w-1/2 bg-gray-900 border border-gray-700 p-2 rounded-lg text-xs text-white focus:outline-none">
                                        <input type="number" step="any" id="ing-kg-${rec.id}" placeholder="किलो (kg)" class="w-1/2 bg-gray-900 border border-gray-700 p-2 rounded-lg text-xs text-white focus:outline-none">
                                    </div>
                                    <input type="number" step="any" id="ing-rate-${rec.id}" placeholder="रेट ₹/kg" required class="bg-gray-900 border border-gray-700 p-2 rounded-lg text-xs text-white focus:outline-none">
                                </div>
                                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-xs">सामग्री शामिल करें</button>
                            </form>

                            <!-- Ingredients List -->
                            <div class="space-y-2">
                                <h4 class="text-xs font-bold text-gray-400 uppercase">सामग्री विवरण (${rec.ingredients.length})</h4>
                                <div class="space-y-1.5">
                    `;

                    rec.ingredients.forEach(ing => {
                        const ingKg = (Number(ing.gramQty)||0)/1000 + (Number(ing.kgQty)||0);
                        const ingCost = ingKg * (Number(ing.ratePerKg)||0);
                        let weightStr = ing.gramQty > 0 ? `${ing.gramQty} gm` : '';
                        if (ing.kgQty > 0) weightStr += (weightStr ? ' + ' : '') + `${ing.kgQty} kg`;
                        
                        // Separated Ingredient Image fallback to recipe photo if not set
                        const displayImg = ing.photo || rec.photo;

                        html += `
                            <div onclick="openZoomModal('${displayImg}', '${ing.name}', 'मात्रा: ${weightStr} | दर: ₹${ing.ratePerKg}/kg | कुल: ₹${ingCost.toFixed(2)}')" class="bg-black/30 hover:bg-black/50 p-2.5 rounded-xl border border-gray-700 flex items-center justify-between cursor-pointer transition">
                                <div class="flex items-center space-x-3">
                                    <img src="${displayImg}" class="w-10 h-10 rounded-lg object-cover border border-gray-600">
                                    <div>
                                        <h5 class="text-xs font-bold text-gray-200">${ing.name}</h5>
                                        <p class="text-[11px] text-yellow-400 font-semibold">${weightStr} <span class="text-gray-400">• ₹${ing.ratePerKg}/kg</span></p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs font-bold text-emerald-400">₹${ingCost.toFixed(2)}</span>
                                    <button onclick="event.stopPropagation(); openEditIngModal('${rec.id}', '${ing.id}')" class="text-gray-400 hover:text-yellow-400 p-1.5"><i class="fa-solid fa-pen-to-square text-xs"></i></button>
                                    <button onclick="event.stopPropagation(); confirmDeleteIngredient('${rec.id}', '${ing.id}', '${ing.name}')" class="text-gray-400 hover:text-red-400 p-1.5"><i class="fa-solid fa-trash-can text-xs"></i></button>
                                </div>
                            </div>
                        `;
                    });

                    html += `
                                </div>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        // Header & Recipe Actions
        function triggerHeaderUpload() { document.getElementById('header-file-input').click(); }
        function uploadHeaderLogo(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = evt => {
                    document.getElementById('app-logo').src = evt.target.result;
                    localStorage.setItem('app_header_logo', evt.target.result);
                };
                reader.readAsDataURL(file);
            }
        }
        function editAppHeader() {
            const newTitle = prompt('नया टाइटल:', localStorage.getItem('app_header_title') || 'रेसिपी और कॉस्ट मैनेजर');
            if (newTitle !== null) {
                const newSub = prompt('नया सब-टाइटल:', localStorage.getItem('app_header_sub') || 'भोग प्रसादी सामग्री');
                localStorage.setItem('app_header_title', newTitle);
                if (newSub !== null) localStorage.setItem('app_header_sub', newSub);
                document.getElementById('app-title-display').innerText = newTitle;
                document.getElementById('app-sub-display').innerText = newSub || '';
            }
        }

        function triggerRecipePhotoUpload(recId) { document.getElementById(`photo-input-${recId}`).click(); }
        function uploadRecipePhoto(e, recId) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = evt => {
                    const rec = recipes.find(r => r.id === recId);
                    if (rec) { rec.photo = evt.target.result; saveRecipes(); }
                };
                reader.readAsDataURL(file);
            }
        }
        function editRecipeTitle(recId) {
            const rec = recipes.find(r => r.id === recId);
            if (!rec) return;
            const newTitle = prompt('रेसिपी का नाम:', rec.title);
            if (newTitle) {
                const newSub = prompt('सब-टाइटल:', rec.subtitle);
                rec.title = newTitle;
                if (newSub !== null) rec.subtitle = newSub;
                saveRecipes();
            }
        }

        // Ingredient Editing with Separate Image
        function openEditIngModal(recId, ingId) {
            const rec = recipes.find(r => r.id === recId);
            if (!rec) return;
            const ing = rec.ingredients.find(i => i.id === ingId);
            if (!ing) return;

            currentEditingIng = { recId, ingId, tempPhoto: ing.photo || '' };
            document.getElementById('edit-ing-name').value = ing.name;
            document.getElementById('edit-ing-gram').value = ing.gramQty || 0;
            document.getElementById('edit-ing-kg').value = ing.kgQty || 0;
            document.getElementById('edit-ing-rate').value = ing.ratePerKg || 0;
            document.getElementById('edit-ing-preview').src = ing.photo || rec.photo;

            document.getElementById('edit-ing-modal').classList.add('active');
        }
        function closeEditIngModal() { document.getElementById('edit-ing-modal').classList.remove('active'); }

        function previewEditIngPhoto(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = evt => {
                    currentEditingIng.tempPhoto = evt.target.result;
                    document.getElementById('edit-ing-preview').src = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveIngredientEdit() {
            const { recId, ingId, tempPhoto } = currentEditingIng;
            const rec = recipes.find(r => r.id === recId);
            if (!rec) return;
            const ing = rec.ingredients.find(i => i.id === ingId);
            if (!ing) return;

            ing.name = document.getElementById('edit-ing-name').value.trim() || ing.name;
            ing.gramQty = parseFloat(document.getElementById('edit-ing-gram').value) || 0;
            ing.kgQty = parseFloat(document.getElementById('edit-ing-kg').value) || 0;
            ing.ratePerKg = parseFloat(document.getElementById('edit-ing-rate').value) || 0;
            if (tempPhoto) ing.photo = tempPhoto;

            saveRecipes();
            closeEditIngModal();
        }

        function addIngredient(e, recId) {
            e.preventDefault();
            const rec = recipes.find(r => r.id === recId);
            if (!rec) return;
            const name = document.getElementById(`ing-name-${recId}`).value.trim();
            const gramQty = parseFloat(document.getElementById(`ing-gram-${recId}`).value) || 0;
            const kgQty = parseFloat(document.getElementById(`ing-kg-${recId}`).value) || 0;
            const ratePerKg = parseFloat(document.getElementById(`ing-rate-${recId}`).value) || 0;

            if (name) {
                rec.ingredients.push({ id: Date.now().toString(), name, gramQty, kgQty, ratePerKg, photo: '' });
                saveRecipes();
            }
        }

        function openAddRecipeModal() { document.getElementById('add-recipe-modal').classList.add('active'); }
        function closeAddRecipeModal() { document.getElementById('add-recipe-modal').classList.remove('active'); }
        function createNewRecipe() {
            const name = document.getElementById('new-rec-name').value.trim();
            const sub = document.getElementById('new-rec-sub').value.trim();
            if (name) {
                const newRec = {
                    id: 'rec-' + Date.now(),
                    title: name,
                    subtitle: sub || 'स्वादिष्ट प्रसादी',
                    photo: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400',
                    ingredients: []
                };
                recipes.push(newRec);
                activeRecipeId = newRec.id;
                saveRecipes();
                closeAddRecipeModal();
            }
        }

        // Modals & Zoom
        function openZoomModal(imgSrc, title, desc) {
            document.getElementById('zoom-img').src = imgSrc;
            document.getElementById('zoom-title').innerText = title;
            document.getElementById('zoom-desc').innerText = desc;
            document.getElementById('zoom-modal').classList.add('active');
        }
        function closeZoomModal() { document.getElementById('zoom-modal').classList.remove('active'); }

        function openConfirmModal(text, onYes) {
            document.getElementById('confirm-text').innerText = text;
            confirmCallback = onYes;
            document.getElementById('confirm-modal').classList.add('active');
        }
        function closeConfirmModal(isYes) {
            document.getElementById('confirm-modal').classList.remove('active');
            if (isYes && confirmCallback) confirmCallback();
            confirmCallback = null;
        }
        document.getElementById('confirm-yes-btn').onclick = () => closeConfirmModal(true);

        function confirmDeleteRecipe(recId) {
            openConfirmModal('क्या आप वाकई इस रेसिपी को हटाना चाहते हैं?', () => {
                recipes = recipes.filter(r => r.id !== recId);
                saveRecipes();
            });
        }
        function confirmDeleteIngredient(recId, ingId, ingName) {
            openConfirmModal(`क्या आप "${ingName}" को हटाना चाहते हैं?`, () => {
                const rec = recipes.find(r => r.id === recId);
                if (rec) { rec.ingredients = rec.ingredients.filter(i => i.id !== ingId); saveRecipes(); }
            });
        }

        applyTheme();
        renderRecipes();
    </script>
</body>
</html>
