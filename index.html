<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भोग प्रसादी मास्टर मैनेजर</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-main, #0f172a);
            color: var(--text-main, #f8fafc);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .theme-card {
            background-color: var(--bg-card, #1e293b);
            border-color: var(--border-card, #334155);
        }
        .theme-accent-text { color: var(--accent-color, #eab308); }
        .theme-accent-bg { background-color: var(--accent-color, #eab308); }
        .modal { display: none; }
        .modal.active { display: flex; }
        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6 pb-24">

    <!-- Top Header App Bar -->
    <header id="main-header" class="theme-card border p-4 rounded-2xl shadow-xl mb-6 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center space-x-3">
            <!-- App Logo with Edit Badge -->
            <div class="relative group cursor-pointer" onclick="triggerHeaderUpload()" title="लोगो बदलें">
                <img id="app-logo" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=200" class="w-14 h-14 rounded-full object-cover border-2 border-yellow-500 shadow-md transition transform group-hover:scale-105">
                <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                    <i class="fa-solid fa-camera text-white text-xs"></i>
                </div>
                <input type="file" id="header-file-input" accept="image/*" class="hidden" onchange="uploadHeaderLogo(event)">
            </div>
            <div>
                <h1 id="app-title-text" onclick="editAppHeader()" class="text-xl font-bold theme-accent-text cursor-pointer flex items-center gap-2 group">
                    <span id="app-title-display">रेसिपी और कॉस्ट मैनेजर</span>
                    <i class="fa-solid fa-pen-to-square text-xs text-gray-400 group-hover:text-yellow-400"></i>
                </h1>
                <p id="app-sub-text" onclick="editAppHeader()" class="text-xs text-gray-400 cursor-pointer flex items-center gap-1 group">
                    <span id="app-sub-display">भोग प्रसादी सामग्री</span>
                    <i class="fa-solid fa-pen text-[10px] text-gray-500 group-hover:text-gray-300"></i>
                </p>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="flex items-center space-x-2">
            <!-- Theme Manager Button -->
            <button onclick="openThemeModal()" class="bg-gray-700 hover:bg-gray-600 text-gray-200 p-2.5 rounded-xl text-sm shadow transition flex items-center gap-1.5" title="कलर व थीम सेटिंग्स">
                <i class="fa-solid fa-palette text-yellow-400"></i>
                <span class="hidden sm:inline">थीम बदलें</span>
            </button>
            
            <!-- Add Recipe Button -->
            <button onclick="openAddRecipeModal()" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2.5 px-3.5 rounded-xl text-sm shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> 
                <span>नई रेसिपी</span>
            </button>
        </div>
    </header>

    <!-- Recipe Cards Main Container -->
    <main id="recipes-container" class="space-y-4 max-w-4xl mx-auto"></main>

    <!-- Full-Screen / Page View Modal for Detailed View -->
    <div id="full-page-modal" class="modal fixed inset-0 bg-black/85 backdrop-blur-md z-50 justify-center items-center p-2 sm:p-4 overflow-y-auto">
        <div class="theme-card border max-w-2xl w-full rounded-2xl overflow-hidden shadow-2xl relative my-auto max-h-[92vh] flex flex-col">
            <!-- Modal Top Header Bar -->
            <div class="p-3 border-b border-gray-700 flex items-center justify-between bg-black/30">
                <span class="text-xs font-semibold uppercase tracking-wider text-yellow-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-book-open"></i> विस्तृत विवरण पेज
                </span>
                <button onclick="closeFullPageModal()" class="text-gray-400 hover:text-white bg-gray-800 hover:bg-gray-700 w-8 h-8 rounded-full flex items-center justify-center transition">
                    ✕
                </button>
            </div>

            <!-- Page Body Scrollable Content -->
            <div class="p-4 sm:p-6 space-y-5 overflow-y-auto">
                <!-- Large Image Display with Quick Change -->
                <div class="relative group rounded-2xl overflow-hidden border border-gray-700 shadow-xl bg-gray-900 h-64 sm:h-80 flex items-center justify-center">
                    <img id="page-view-img" src="" class="w-full h-full object-cover">
                    <button onclick="triggerModalPhotoUpload()" class="absolute bottom-3 right-3 bg-black/70 hover:bg-black/90 text-white text-xs px-3 py-2 rounded-xl flex items-center gap-2 border border-gray-600 transition">
                        <i class="fa-solid fa-camera text-yellow-400"></i> फोटो बदलें
                    </button>
                    <input type="file" id="modal-file-input" accept="image/*" class="hidden" onchange="uploadModalPhoto(event)">
                </div>

                <!-- Title & Meta Info -->
                <div class="flex items-start justify-between gap-3 border-b border-gray-700/60 pb-4">
                    <div>
                        <h2 id="page-view-title" class="text-2xl font-extrabold theme-accent-text"></h2>
                        <p id="page-view-subtitle" class="text-sm text-gray-300 mt-1"></p>
                    </div>
                    <button id="page-edit-btn" class="bg-gray-700 hover:bg-gray-600 text-yellow-400 p-2.5 rounded-xl text-sm flex items-center gap-1.5 transition" title="इसे एडिट करें">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span class="text-xs text-white">एडिट</span>
                    </button>
                </div>

                <!-- Detailed Text & Description Area -->
                <div class="bg-black/25 p-4 rounded-xl border border-gray-700/50 space-y-2">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wide flex items-center gap-1.5">
                        <i class="fa-solid fa-align-left text-yellow-400"></i> विवरण व विधि नोट्स (Description / Method)
                    </h4>
                    <p id="page-view-desc" class="text-sm text-gray-200 leading-relaxed whitespace-pre-line"></p>
                </div>

                <!-- Custom Stats / Breakdown List -->
                <div id="page-view-extra-content" class="space-y-3"></div>
            </div>

            <!-- Page View Footer -->
            <div class="p-3 border-t border-gray-700 bg-black/30 flex justify-end">
                <button onclick="closeFullPageModal()" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold px-5 py-2 rounded-xl text-sm transition">
                    बंद करें
                </button>
            </div>
        </div>
    </div>

    <!-- Theme & Color Customizer Modal -->
    <div id="theme-modal" class="modal fixed inset-0 bg-black/75 backdrop-blur-sm z-50 justify-center items-center p-4">
        <div class="theme-card border p-5 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-gray-700 pb-2">
                <h3 class="text-lg font-bold text-yellow-400 flex items-center gap-2">
                    <i class="fa-solid fa-palette"></i> कलर व स्टाइल मैनेजर
                </h3>
                <button onclick="closeThemeModal()" class="text-gray-400 hover:text-white">✕</button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div class="flex justify-between items-center">
                    <label class="text-gray-300">मुख्य बैकग्राउंड (Body BG)</label>
                    <input type="color" id="theme-bg-main" onchange="applyCustomTheme()" class="w-10 h-8 rounded border border-gray-600 bg-transparent cursor-pointer">
                </div>
                <div class="flex justify-between items-center">
                    <label class="text-gray-300">कार्ड बैकग्राउंड (Card BG)</label>
                    <input type="color" id="theme-bg-card" onchange="applyCustomTheme()" class="w-10 h-8 rounded border border-gray-600 bg-transparent cursor-pointer">
                </div>
                <div class="flex justify-between items-center">
                    <label class="text-gray-300">हाईलाइट/एक्सेंट रंग (Accent)</label>
                    <input type="color" id="theme-accent" onchange="applyCustomTheme()" class="w-10 h-8 rounded border border-gray-600 bg-transparent cursor-pointer">
                </div>
                <div class="flex justify-between items-center">
                    <label class="text-gray-300">मुख्य टेक्स्ट रंग (Text Main)</label>
                    <input type="color" id="theme-text" onchange="applyCustomTheme()" class="w-10 h-8 rounded border border-gray-600 bg-transparent cursor-pointer">
                </div>
                <div class="flex justify-between items-center">
                    <label class="text-gray-300">बॉर्डर रंग (Border Color)</label>
                    <input type="color" id="theme-border" onchange="applyCustomTheme()" class="w-10 h-8 rounded border border-gray-600 bg-transparent cursor-pointer">
                </div>
            </div>

            <div class="flex justify-between items-center pt-2">
                <button onclick="resetTheme()" class="text-xs text-red-400 hover:underline">डिफ़ॉल्ट रीसेट करें</button>
                <button onclick="closeThemeModal()" class="bg-yellow-500 text-gray-900 font-bold px-4 py-1.5 rounded-xl text-xs">लागू करें</button>
            </div>
        </div>
    </div>

    <!-- Edit Ingredient Modal -->
    <div id="edit-ing-modal" class="modal fixed inset-0 bg-black/75 backdrop-blur-sm z-50 justify-center items-center p-4">
        <div class="theme-card border p-5 rounded-2xl max-w-xs w-full space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-gray-700 pb-2">
                <h3 class="text-base font-bold text-yellow-400 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> सामग्री में सुधार करें
                </h3>
                <button onclick="closeEditIngModal()" class="text-gray-400 hover:text-white">✕</button>
            </div>
            
            <input type="hidden" id="edit-ing-rec-id">
            <input type="hidden" id="edit-ing-id">
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-400">सामग्री का नाम</label>
                    <input type="text" id="edit-ing-name" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-gray-400">ग्राम (gm)</label>
                        <input type="number" step="any" id="edit-ing-gram" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400">किलो (kg)</label>
                        <input type="number" step="any" id="edit-ing-kg" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-gray-400">रेट (₹/kg)</label>
                    <input type="number" step="any" id="edit-ing-rate" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400">सामग्री नोट्स/विवरण</label>
                    <textarea id="edit-ing-notes" rows="2" placeholder="जैसे: ब्रांड या विशेष प्रयोग..." class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-xs mt-1 focus:outline-none focus:border-yellow-500"></textarea>
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2 border-t border-gray-700">
                <button onclick="closeEditIngModal()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-xl text-sm">रद्द करें</button>
                <button onclick="saveIngredientEdit()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-sm">सेव करें</button>
            </div>
        </div>
    </div>

    <!-- Edit Recipe Modal -->
    <div id="edit-recipe-modal" class="modal fixed inset-0 bg-black/75 backdrop-blur-sm z-50 justify-center items-center p-4">
        <div class="theme-card border p-5 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-gray-700 pb-2">
                <h3 class="text-base font-bold text-yellow-400 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> रेसिपी एडिट करें
                </h3>
                <button onclick="closeEditRecipeModal()" class="text-gray-400 hover:text-white">✕</button>
            </div>
            
            <input type="hidden" id="edit-rec-id">
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-400">रेसिपी का नाम</label>
                    <input type="text" id="edit-rec-title" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400">सब-टाइटल (विवरण)</label>
                    <input type="text" id="edit-rec-subtitle" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400">फोटो यूआरएल (Image URL)</label>
                    <input type="text" id="edit-rec-photo" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-xs mt-1 focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400">पूर्ण विवरण व विधि नोट्स</label>
                    <textarea id="edit-rec-notes" rows="3" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-xs mt-1 focus:outline-none focus:border-yellow-500"></textarea>
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2 border-t border-gray-700">
                <button onclick="closeEditRecipeModal()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-xl text-sm">रद्द करें</button>
                <button onclick="saveRecipeEdit()" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold px-4 py-2 rounded-xl text-sm">अपडेट करें</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal fixed inset-0 bg-black/75 backdrop-blur-sm z-50 justify-center items-center p-4">
        <div class="theme-card border p-5 rounded-2xl max-w-xs w-full text-center space-y-4 shadow-2xl">
            <i class="fa-solid fa-triangle-exclamation text-yellow-400 text-3xl"></i>
            <h3 id="confirm-text" class="text-sm font-semibold text-gray-100">क्या आप वाकई इसे हटाना चाहते हैं?</h3>
            <div class="flex justify-center space-x-3">
                <button onclick="closeConfirmModal(false)" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-xl text-sm">नहीं, रद्द करें</button>
                <button id="confirm-yes-btn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-xl text-sm font-bold">हाँ, हटाएँ</button>
            </div>
        </div>
    </div>

    <!-- Add Recipe Modal -->
    <div id="add-recipe-modal" class="modal fixed inset-0 bg-black/75 backdrop-blur-sm z-50 justify-center items-center p-4">
        <div class="theme-card border p-5 rounded-2xl max-w-xs w-full space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-yellow-400 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> नई रेसिपी जोड़ें
            </h3>
            <div>
                <label class="text-xs text-gray-400">रेसिपी का नाम</label>
                <input type="text" id="new-rec-name" placeholder="जैसे: समोसा मसाला" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
            </div>
            <div>
                <label class="text-xs text-gray-400">उप-शीर्षक (विवरण)</label>
                <input type="text" id="new-rec-sub" placeholder="जैसे: 5kg बैच प्रसादी" class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-sm mt-1 focus:outline-none focus:border-yellow-500">
            </div>
            <div>
                <label class="text-xs text-gray-400">विवरण या बनाने की विधि</label>
                <textarea id="new-rec-notes" placeholder="रेसिपी से जुड़े मुख्य नोट्स..." class="w-full bg-gray-900 border border-gray-700 p-2 rounded-xl text-xs mt-1 focus:outline-none focus:border-yellow-500" rows="2"></textarea>
            </div>
            <div class="flex justify-end space-x-2 pt-2 border-t border-gray-700">
                <button onclick="closeAddRecipeModal()" class="bg-gray-700 px-4 py-2 rounded-xl text-sm">रद्द करें</button>
                <button onclick="createNewRecipe()" class="bg-yellow-500 text-gray-900 font-bold px-4 py-2 rounded-xl text-sm">जोड़ें</button>
            </div>
        </div>
    </div>

    <script>

        const defaultTheme = {

        function calculateTotals(ingredients) {
            let totalWeightKg = 0;
            let totalCost = 0;
            ingredients.forEach(item => {
                const itemKg = (Number(item.gramQty) || 0) / 1000 + (Number(item.kgQty) || 0);
                const itemCost = itemKg * (Number(item.ratePerKg) || 0);
                totalWeightKg += itemKg;
                totalCost += itemCost;
            });
            return { totalWeightKg, totalCost };
        }

        // --- Full Page View (Modal) Logic ---
        function openFullPageRecipeView(recId) {
            const rec = recipes.find(r => r.id === recId);
            if (!rec) return;

            const { totalWeightKg, totalCost } = calculateTotals(rec.ingredients);
            currentModalTarget = { type: 'recipe', recId };

            document.getElementById('page-view-img').src = rec.photo;
            document.getElementById('page-view-title').innerText = rec.title;
            document.getElementById('page-view-subtitle').innerText = `${rec.subtitle} • कुल सामग्री: ${rec.ingredients.length}`;
            document.getElementById('page-view-desc').innerText = rec.notes || 'कोई विस्तृत नोट्स या विधि उपलब्ध नहीं है।';

            // Extra Content Breakdown
            let extraHtml = `
                <div class="grid grid-cols-2 gap-3 mt-4">
                    <div class="bg-gray-900/80 p-3 rounded-xl border border-gray-700">
                        <span class="text-xs text-gray-400 block">कुल रेसिपी लागत</span>
                        <span class="text-lg font-bold theme-accent-text">₹${totalCost.toFixed(2)}</span>
                    </div>
                    <div class="bg-gray-900/80 p-3 rounded-xl border border-gray-700">
                        <span class="text-xs text-gray-400 block">कुल वजन</span>
                        <span class="text-lg font-bold text-emerald-400">${totalWeightKg.toFixed(3)} kg</span>
                    </div>
                </div>

                <div class="mt-4">
                    <h5 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">शामिल सामग्रियां</h5>
                    <div class="space-y-1 max-h-48 overflow-y-auto pr-1">
            `;

            rec.ingredients.forEach(ing => {
                const ingKg = (Number(ing.gramQty)||0)/1000 + (Number(ing.kgQty)||0);
                const cost = ingKg * (Number(ing.ratePerKg)||0);
                extraHtml += `
                    <div class="flex justify-between items-center text-xs bg-gray-900/50 p-2 rounded-lg border border-gray-800">
                        <span class="text-gray-200">${ing.name}</span>
                        <span class="text-gray-400">${ing.gramQty ? ing.gramQty+'gm' : ''} ${ing.kgQty ? ing.kgQty+'kg' : ''} @ ₹${ing.ratePerKg}/kg = <b class="text-emerald-400">₹${cost.toFixed(2)}</b></span>

                `;
            });

            extraHtml += `</div></div>`;
            document.getElementById('page-view-extra-content').innerHTML = extraHtml;

            // Wire Page Edit Button
            document.getElementById('page-edit-btn').onclick = () => {
                closeFullPageModal();
                openEditRecipeModal(recId);
            };

            document.getElementById('full-page-modal').classList.add('active');
        }

        function openFullPageIngView(recId, ingId) {
            const rec = recipes.find(r => r.id === recId);
            if (!rec) return;
            const ing = rec.ingredients.find(i => i.id === ingId);
            if (!ing) return;

            currentModalTarget = { type: 'ingredient', recId, ingId };

            const ingKg = (Number(ing.gramQty)||0)/1000 + (Number(ing.kgQty)||0);
            const totalCost = ingKg * (Number(ing.ratePerKg)||0);

            document.getElementById('page-view-img').src = rec.photo; // Use parent recipe photo for ingredient context
            document.getElementById('page-view-title').innerText = ing.name;
            document.getElementById('page-view-subtitle').innerText = `रेसिपी: ${rec.title}`;
            document.getElementById('page-view-desc').innerText = ing.notes || 'इस सामग्री के लिए कोई विशेष टिप्पणी दर्ज नहीं है।';

            let extraHtml = `
                <div class="bg-gray-900/80 p-4 rounded-xl border border-gray-700 space-y-3 mt-4">
                    <h5 class="text-xs font-bold text-yellow-400 uppercase tracking-wide">मात्रा एवं लागत गणना (Calculation)</h5>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-gray-800 p-2 rounded-lg"><span class="text-gray-400 block">मात्रा (ग्राम):</span> <b class="text-white">${ing.gramQty || 0} gm</b></div>
                        <div class="bg-gray-800 p-2 rounded-lg"><span class="text-gray-400 block">मात्रा (किलो):</span> <b class="text-white">${ing.kgQty || 0} kg</b></div>
                        <div class="bg-gray-800 p-2 rounded-lg"><span class="text-gray-400 block">दर (Rate):</span> <b class="text-white">₹${ing.ratePerKg} / kg</b></div>
                        <div class="bg-gray-800 p-2 rounded-lg"><span class="text-gray-400 block">कुल लागत:</span> <b class="text-emerald-400 text-sm">₹${totalCost.toFixed(2)}</b></div>
                    </div>
                </div>
            `;
            document.getElementById('page-view-extra-content').innerHTML = extraHtml;

            // Wire Page Edit Button
            document.getElementById('page-edit-btn').onclick = () => {
                closeFullPageModal();
                openEditIngModal(recId, ingId);
            };

            document.getElementById('full-page-modal').classList.add('active');
        }

        function closeFullPageModal() {
            document.getElementById('full-page-modal').classList.remove('active');
            currentModalTarget = null;
        }

        // Upload Photo from Page View Modal
        function triggerModalPhotoUpload() {
            document.getElementById('modal-file-input').click();
        }

        function uploadModalPhoto(e) {
            const file = e.target.files[0];
            if (file && currentModalTarget) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const newUrl = evt.target.result;
                    document.getElementById('page-view-img').src = newUrl;
                    
                    if (currentModalTarget.type === 'recipe') {
                        const rec = recipes.find(r => r.id === currentModalTarget.recId);
                        if (rec) rec.photo = newUrl;
                    }
                    saveRecipes();
                };
                reader.readAsDataURL(file);
            }
        }

        // --- App Header Handlers ---
        function triggerHeaderUpload() { document.getElementById('header-file-input').click(); }
        function uploadHeaderLogo(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('app-logo').src = evt.target.result;
                    localStorage.setItem('app_header_logo', evt.target.result);
                };
                reader.readAsDataURL(file);
            }
        }
        function editAppHeader() {
            const currentTitle = localStorage.getItem('app_header_title') || 'रेसिपी और कॉस्ट मैनेजर';
            const currentSub = localStorage.getItem('app_header_sub') || 'भोग प्रसादी सामग्री';
            const newTitle = prompt('नया टाइटल दर्ज करें:', currentTitle);
            if (newTitle !== null) {
                const newSub = prompt('नया सब-टाइटल दर्ज करें:', currentSub);
                localStorage.setItem('app_header_title', newTitle);
                if (newSub !== null) localStorage.setItem('app_header_sub', newSub);
                document.getElementById('app-title-display').innerText = newTitle;
                document.getElementById('app-sub-display').innerText = newSub || '';
            }
        }

        // --- Recipe Edit Handlers ---
        function triggerRecipePhotoUpload(recId) { document.getElementById(`photo-input-${recId}`).click(); }
        function uploadRecipePhoto(e, recId) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const rec = recipes.find(r => r.id === recId);
                    if (rec) {
                        rec.photo = evt.target.result;
                        saveRecipes();
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function openEditRecipeModal(recId) {
            const rec = recipes.find(r => r.id === recId);
            if (!rec) return;

            document.getElementById('edit-rec-id').value = recId;
            document.getElementById('edit-rec-title').value = rec.title;
            document.getElementById('edit-rec-subtitle').value = rec.subtitle;
            document.getElementById('edit-rec-photo').value = rec.photo;
            document.getElementById('edit-rec-notes').value = rec.notes || '';

            document.getElementById('edit-recipe-modal').classList.add('active');
        }

        function closeEditRecipeModal() {
            document.getElementById('edit-recipe-modal').classList.remove('active');
        }

        function saveRecipeEdit() {
            const recId = document.getElementById('edit-rec-id').value;
            const rec = recipes.find(r => r.id === recId);
            if (!rec) return;

            const title = document.getElementById('edit-rec-title').value.trim();
            const subtitle = document.getElementById('edit-rec-subtitle').value.trim();
            const photo = document.getElementById('edit-rec-photo').value.trim();
            const notes = document.getElementById('edit-rec-notes').value.trim();

            if (title) {
                rec.title = title;
                rec.subtitle = subtitle;
                if (photo) rec.photo = photo;
                rec.notes = notes;

                saveRecipes();
                closeEditRecipeModal();
            }
        }

        // --- Ingredient Add / Edit Handlers ---
        function addIngredient(e, recId) {
            e.preventDefault();
            const rec = recipes.find(r => r.id === recId);
            if (!rec) return;

            const name = document.getElementById(`ing-name-${recId}`).value.trim();
            const gramQty = parseFloat(document.getElementById(`ing-gram-${recId}`).value) || 0;
            const kgQty = parseFloat(document.getElementById(`ing-kg-${recId}`).value) || 0;
            const ratePerKg = parseFloat(document.getElementById(`ing-rate-${recId}`).value) || 0;

            if (name && (gramQty > 0 || kgQty > 0) && ratePerKg >= 0) {
                rec.ingredients.push({
                    id: Date.now().toString(),
                    name, gramQty, kgQty, ratePerKg, notes: ''
                });
                saveRecipes();
            }
        }

        function openEditIngModal(recId, ingId) {
            const rec = recipes.find(r => r.id === recId);
            if (!rec) return;
            const ing = rec.ingredients.find(i => i.id === ingId);
            if (!ing) return;

            document.getElementById('edit-ing-rec-id').value = recId;
            document.getElementById('edit-ing-id').value = ingId;
            document.getElementById('edit-ing-name').value = ing.name;
            document.getElementById('edit-ing-gram').value = ing.gramQty || '';
            document.getElementById('edit-ing-kg').value = ing.kgQty || '';
            document.getElementById('edit-ing-rate').value = ing.ratePerKg || '';
            document.getElementById('edit-ing-notes').value = ing.notes || '';

            document.getElementById('edit-ing-modal').classList.add('active');
        }

        function closeEditIngModal() {
            document.getElementById('edit-ing-modal').classList.remove('active');
        }

        function saveIngredientEdit() {
            const recId = document.getElementById('edit-ing-rec-id').value;
            const ingId = document.getElementById('edit-ing-id').value;

            const rec = recipes.find(r => r.id === recId);
            if (!rec) return;
            const ing = rec.ingredients.find(i => i.id === ingId);
            if (!ing) return;

            const newName = document.getElementById('edit-ing-name').value.trim();
            const newGram = parseFloat(document.getElementById('edit-ing-gram').value) || 0;
            const newKg = parseFloat(document.getElementById('edit-ing-kg').value) || 0;
            const newRate = parseFloat(document.getElementById('edit-ing-rate').value) || 0;
            const newNotes = document.getElementById('edit-ing-notes').value.trim();

            if (newName && (newGram >= 0 || newKg >= 0) && newRate >= 0) {
                ing.name = newName;
                ing.gramQty = newGram;
                ing.kgQty = newKg;
                ing.ratePerKg = newRate;
                ing.notes = newNotes;

                saveRecipes();
                closeEditIngModal();
            }
        }

        // --- Add New Recipe Handlers ---
        function openAddRecipeModal() { document.getElementById('add-recipe-modal').classList.add('active'); }
        function closeAddRecipeModal() { document.getElementById('add-recipe-modal').classList.remove('active'); }
        function createNewRecipe() {
            const name = document.getElementById('new-rec-name').value.trim();
            const sub = document.getElementById('new-rec-sub').value.trim();
            const notes = document.getElementById('new-rec-notes').value.trim();
            if (name) {
                const newRec = {
                    id: 'rec-' + Date.now(),
                    title: name,
                    subtitle: sub || 'स्वादिष्ट प्रसादी',
                    photo: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600',
                    notes: notes || 'नई रेसिपी प्रविष्टि।',
                    ingredients: []
                };
                recipes.push(newRec);
                activeRecipeId = newRec.id;
                saveRecipes();
                closeAddRecipeModal();
                document.getElementById('new-rec-name').value = '';
                document.getElementById('new-rec-sub').value = '';
                document.getElementById('new-rec-notes').value = '';
            }
        }

        // --- Confirmation Modal Handlers ---
        function openConfirmModal(text, onYes) {
            document.getElementById('confirm-text').innerText = text;
            confirmCallback = onYes;
            document.getElementById('confirm-modal').classList.add('active');
        }
        function closeConfirmModal(isYes) {
            document.getElementById('confirm-modal').classList.remove('active');
            if (isYes && confirmCallback) confirmCallback();
            confirmCallback = null;
        }
        document.getElementById('confirm-yes-btn').onclick = () => closeConfirmModal(true);

        function confirmDeleteRecipe(recId) {
            const rec = recipes.find(r => r.id === recId);
            openConfirmModal(`क्या आप वाकई पूरी "${rec ? rec.title : ''}" रेसिपी को हटाना चाहते हैं?`, () => {
                recipes = recipes.filter(r => r.id !== recId);
                if (activeRecipeId === recId) activeRecipeId = recipes[0] ? recipes[0].id : null;
                saveRecipes();
            });
        }

        function confirmDeleteIngredient(recId, ingId, ingName) {
            openConfirmModal(`क्या आप "${ingName}" सामग्री को हटाना चाहते हैं?`, () => {
                const rec = recipes.find(r => r.id === recId);
                if (rec) {
                    rec.ingredients = rec.ingredients.filter(i => i.id !== ingId);
                    saveRecipes();
                }
            });
        }

        // Initialize Theme & Render App
        initTheme();
        renderRecipes();
    </script>
</body>
</html>
