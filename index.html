<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भोग प्रसादी मास्टर मैनेजर</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: all 0.3s ease; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }
    </style>
</head>
<body id="app-body" class="bg-gray-900 text-gray-100 min-h-screen p-3 md:p-6 pb-20">

    <!-- Header App Bar -->
    <header id="app-header" class="bg-gray-800 p-4 rounded-2xl shadow-lg mb-6 border border-gray-700 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="relative group cursor-pointer" onclick="triggerHeaderUpload()" title="ऐप लोगो बदलें">
                <img id="app-logo" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=200" class="w-14 h-14 rounded-full object-cover border-2 border-yellow-500 shadow-md">
                <input type="file" id="header-file-input" accept="image/*" class="hidden" onchange="uploadHeaderLogo(event)">
                <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                    <i class="fa-solid fa-camera text-white text-xs"></i>
                </div>
            </div>
            <div>
                <h1 id="app-title-text" onclick="editAppHeader()" class="text-xl font-bold cursor-pointer flex items-center gap-2">
                    <span id="app-title-display">रेसिपी और कॉस्ट मैनेजर</span>
                    <i class="fa-solid fa-pen-to-square text-xs opacity-60"></i>
                </h1>
                <p id="app-sub-text" onclick="editAppHeader()" class="text-xs cursor-pointer opacity-80">
                    <span id="app-sub-display">भोग प्रसादी सामग्री</span>
                </p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openThemeModal()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold p-2.5 rounded-xl text-sm shadow transition flex items-center gap-1" title="थीम व रंग बदलें">
                <i class="fa-solid fa-palette"></i>
            </button>
            <button onclick="openAddRecipeModal()" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 px-3 rounded-xl text-sm shadow transition flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> नई रेसिपी
            </button>
        </div>
    </header>

    <!-- Recipe List Container -->
    <div id="recipes-container" class="space-y-4"></div>

    <!-- Fullscreen Page Modal (For Recipes & Ingredients) -->
    <div id="full-page-modal" class="modal fixed inset-0 bg-black/90 backdrop-blur-md z-50 justify-center items-center p-3
