<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भोग प्रसादी मास्टर मैनेजर</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #111827; color: #F3F4F6; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6 pb-20">

    <!-- Header App Bar -->
    <header class="bg-gray-800 p-4 rounded-2xl shadow-lg mb-6 border border-gray-700 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="relative group cursor-pointer" onclick="triggerHeaderUpload()">
                <img id="app-logo" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=200" class="w-14 h-14 rounded-full object-cover border-2 border-yellow-500 shadow-md">
                <input type="file" id="header-file-input" accept="image/*" class="hidden" onchange="uploadHeaderLogo(event)">
            </div>
            <div>
                <h1 id="app-title-text" onclick="editAppHeader()" class="text-xl font-bold text-yellow-400 cursor-pointer flex items-center gap-2">
                    <span id="app-title-display">रेसिपी और कॉस्ट मैनेजर</span>
                    <i class="fa-solid fa-pen-to-square text-xs text-gray-400"></i>
                </h1>
                <p id="app-sub-text" onclick="editAppHeader()" class="text-xs text-gray-300 cursor-pointer">
                    <span id="app-sub-display">भोग प्रसादी सामग्री</span>
                </p>
